
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c8c7cc">
<title>@Footprintzone | Footprint For Big Trader</title>
<style>
:root {
  --bg: #c8c7cc;
  --neon: #b6ff00;
  --green: #00ff83;
  --black: #000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #000;
  font-family: Arial, Helvetica, sans-serif;
}
.page {
  max-width: 760px;
  margin: auto;
  padding: 56px 24px 35px;
}
.profile { text-align: center; }
.avatar {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
  border: 0;
}
h1 {
  font-size: clamp(30px, 7vw, 48px);
  color: var(--neon);
  margin: 35px 0 12px;
  overflow-wrap: anywhere;
}
.tagline {
  font-size: clamp(20px, 4.5vw, 29px);
  font-weight: 600;
  margin: 0;
}
.socials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 34px;
  margin: 38px 0 75px;
}
.socials a {
  color: #000;
  text-decoration: none;
  font-size: 37px;
  font-weight: bold;
  min-width: 34px;
}
.socials svg {
  width: 39px;
  height: 39px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
}
.socials .youtube svg {
  fill: #000;
  stroke: none;
}
.links {
  display: grid;
  gap: 30px;
}
.link {
  display: flex;
  align-items: center;
  min-height: 120px;
  padding: 15px 20px;
  gap: 18px;
  background: var(--black);
  color: var(--neon);
  border: 4px solid var(--green);
  border-radius: 100px;
  box-shadow: 0 5px 0 var(--green);
  text-decoration: none;
  transition: transform .18s;
}
.link:active { transform: scale(.98); }
.link img {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: white;
}
.link-title {
  flex: 1;
  text-align: center;
  font-size: clamp(15px, 3.4vw, 27px);
  font-weight: 500;
  line-height: 1.35;
}
.dots {
  color: #688b00;
  font-size: 27px;
  padding: 0 1px;
}
footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: #555;
}
@media (max-width: 420px) {
  .page { padding: 42px 15px 25px; }
  .avatar { width: 120px; height: 120px; }
  .socials { gap: 27px; margin-bottom: 58px; }
  .link {
    min-height: 94px;
    padding: 10px 13px;
    gap: 10px;
    border-width: 3px;
  }
  .link img { width: 57px; height: 57px; }
  .links { gap: 24px; }
  .dots { font-size: 23px; }
}
</style>
</head>
<body>
<main class="page">
  <header class="profile">
    <!-- Ganti URL ini dengan foto profil lu -->
    <img class="avatar"
      src="https://placehold.co/300x300/eeeeee/111111?text=FZ"
      alt="Foto profil Footprintzone">

    <h1>@Footprintzone</h1>
    <p class="tagline">Footprint For Big Trader</p>

    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/"
         aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://www.tiktok.com/"
         aria-label="TikTok" title="TikTok">♪</a>
      <a href="https://www.threads.net/"
         aria-label="Threads" title="Threads">＠</a>
      <a class="youtube" href="https://www.youtube.com/"
         aria-label="YouTube" title="YouTube">
        <svg viewBox="0 0 24 24">
          <rect x="1" y="4" width="22" height="16" rx="5" fill="#000"/>
          <path d="M10 8 L17 12 L10 16 Z" fill="#c8c7cc"/>
        </svg>
      </a>
    </nav>
  </header>

  <section class="links" aria-label="Link utama">

    <a class="link" href="https://t.me/" target="_blank" rel="noopener">
      <img src="https://placehold.co/150x150/ffffff/111111?text=FZ"
           alt="Footprint Zone">
      <span class="link-title">KOMUNITAS &amp; TOOLS FOOTPRINT ! 🇮🇩</span>
      <span class="dots">⋮</span>
    </a>

    <a class="link" href="https://example.com/" target="_blank" rel="noopener">
      <img src="https://placehold.co/150x150/ffffff/111111?text=B8"
           alt="Bonus akun">
      <span class="link-title">Free 100% Bonus Akun Big Trader !</span>
      <span class="dots">⋮</span>
    </a>

    <a class="link" href="https://example.com/" target="_blank" rel="noopener">
      <img src="https://placehold.co/150x150/ffffff/111111?text=CENT"
           alt="Akun trading cent">
      <span class="link-title">Free Khas Akun Trading Cent</span>
      <span class="dots">⋮</span>
    </a>

  </section>

  <footer>© 2026 @Footprintzone</footer>
</main>
</body>
</html>
