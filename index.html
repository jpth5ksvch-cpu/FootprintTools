
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c8c7cc">

  <title>@Footprintzone | Footprint For Big Trader</title>
  <meta name="description" content="Footprint Zone by Jacky. Footprint trading tools, community, education and trading resources.">

  <style>
    :root {
      --background: #c8c7cc;
      --neon: #b6ff00;
      --green: #00ff83;
      --black: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 55px 24px 35px;
    }

    /* PROFILE */

    .profile {
      text-align: center;
    }

    .avatar {
      width: 145px;
      height: 145px;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }

    .username {
      margin: 35px 0 12px;
      color: var(--neon);
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .tagline {
      margin: 0;
      color: #000;
      font-size: clamp(20px, 4.5vw, 29px);
      font-weight: 600;
    }

    /* SOCIAL MEDIA */

    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      margin: 38px 0 75px;
    }

    .socials a {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 42px;
      height: 42px;
      color: #000;
      text-decoration: none;
      font-size: 36px;
      font-weight: 700;
      transition: transform .2s;
    }

    .socials a:active {
      transform: scale(.9);
    }

    .socials svg {
      width: 39px;
      height: 39px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .socials .youtube svg {
      fill: #000;
      stroke: none;
    }

    /* LINK BUTTONS */

    .links {
      display: grid;
      gap: 30px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 120px;
      padding: 15px 20px;
      color: var(--neon);
      background: var(--black);
      border: 4px solid var(--green);
      border-radius: 100px;
      box-shadow: 0 5px 0 var(--green);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .link:active {
      transform: scale(.98);
      box-shadow: 0 2px 0 var(--green);
    }

    .link-logo {
      width: 78px;
      height: 78px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }

    .link-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: clamp(15px, 3.4vw, 27px);
      font-weight: 500;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .dots {
      flex-shrink: 0;
      padding: 0 1px;
      color: #688b00;
      font-size: 27px;
      line-height: 1;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 420px) {
      .page {
        padding: 42px 15px 25px;
      }

      .avatar {
        width: 120px;
        height: 120px;
      }

      .username {
        margin-top: 30px;
      }

      .socials {
        gap: 25px;
        margin: 35px 0 58px;
      }

      .socials a {
        width: 35px;
        height: 35px;
      }

      .socials svg {
        width: 35px;
        height: 35px;
      }

      .links {
        gap: 24px;
      }

      .link {
        min-height: 94px;
        gap: 10px;
        padding: 10px 13px;
        border-width: 3px;
      }

      .link-logo {
        width: 57px;
        height: 57px;
      }

      .link-title {
        font-size: clamp(14px, 3.7vw, 18px);
      }

      .dots {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .link,
      .socials a {
        transition: none;
      }
    }
  </style>
</head>
